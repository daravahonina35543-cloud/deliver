<div class="mini-card">
    <picture >
        <div class="mini-card__image">
            <img src="@@img.svg" alt="@@alt" class="mini-card__img">
        </div>
    </picture>
    <div class="mini-card__body">
        <h3 class="mini-card__title">@@title</h3>
        <p class="mini-card__text">@@text</p>
    </div>
</div>
